<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the layout reach under the notch; 16px inputs stop
     iOS zooming on focus without disabling pinch-zoom. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PyQuest — Learn Python</title>
<meta name="description" content="Learn Python fundamentals by writing real code that really runs.">

<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PyQuest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#12111a">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app">
  <header id="topbar">
    <button id="back" class="icon-btn" hidden aria-label="Back">‹</button>
    <div id="topbar-title">PyQuest</div>
    <div id="topbar-stats">
      <span id="xp-chip" class="chip" title="Experience points">0 XP</span>
      <span id="streak-chip" class="chip" hidden title="Day streak">🔥 0</span>
    </div>
  </header>

  <main id="screen"></main>
</div>

<div id="keybar" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
